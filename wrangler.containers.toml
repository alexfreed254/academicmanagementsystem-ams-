# OPTIONAL — Cloudflare Containers (Flask-in-Docker)
# Requires Workers Paid + Containers registry access.
# Deploy only when Containers works for your account:
#   npx wrangler deploy -c wrangler.containers.toml
#
# Default cutover path is root wrangler.toml → Hono workers/src (no Containers).

name = "academic-management-system-254"
main = "src/index.ts"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
preview_urls = true

[[containers]]
class_name = "FlaskContainer"
image = "./Dockerfile"
max_instances = 3
instance_type = "basic"

[[durable_objects.bindings]]
name = "FLASK_CONTAINER"
class_name = "FlaskContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlaskContainer"]

[vars]
FLASK_ENV = "production"
SPA_CROSS_SITE = "false"
SUPABASE_URL = "https://kbxaawuxlycetxifltxf.supabase.co"
SPA_ORIGINS = ""
