# Cloudflare Workers configuration for TTTI AMS Backend

name = "ttti-ams-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = true

[env.production]
name = "ttti-ams-backend"
vars = { ENVIRONMENT = "production" }

[env.staging]
name = "ttti-ams-backend-staging"
vars = { ENVIRONMENT = "staging" }

# KV Namespaces for session storage
[[kv_namespaces]]
binding = "SESSIONS"
id = "your-kv-namespace-id"

# Durable Objects for real-time features (biometric, notifications)
[[durable_objects.bindings]]
name = "BIOMETRIC_SESSION"
class_name = "BiometricSession"

[[migrations]]
tag = "v1"
new_classes = ["BiometricSession"]

# Environment variables (set via dashboard or CLI)
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# JWT_SECRET
# CSRF_SECRET

# Rate limiting
[limits]
cpu_ms = 50
