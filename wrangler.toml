# TTTI AMS — Cloudflare Workers Builds (root deploy)
#
# Cloudflare Git integration runs `npx wrangler deploy` at the repo root.
# Cutover architecture: Hono API here → Pages SPA (frontend/) → Supabase.
# Flask Containers are NOT deployed from this file (registry Unauthorized without
# Workers Paid). Optional Containers config: wrangler.containers.toml
#
# Secrets (Dashboard or wrangler secret put):
#   SESSION_SECRET, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY

name = "academic-management-system-254"
main = "workers/src/index.ts"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
preview_urls = true

# Drop Flask Container DO registered by earlier deploys (v1 migration below).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlaskContainer"]

[[migrations]]
tag = "v2"
deleted_classes = ["FlaskContainer"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
SUPABASE_URL = "https://kbxaawuxlycetxifltxf.supabase.co"
ALLOWED_ORIGINS = "http://localhost:5173,https://ttti-ams.pages.dev"
ENVIRONMENT = "production"

# Optional custom domain after DNS is on Cloudflare:
# routes = [{ pattern = "api.yourdomain.ac.ke", custom_domain = true }]
