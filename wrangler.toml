# TTTI AMS — Cloudflare Workers Builds (root deploy)
#
# One Worker URL serves BOTH:
#   /*       → React SPA (frontend/dist Worker Assets)
#   /api/*   → Hono API (workers/src)
#
# Cloudflare Dashboard → Builds → Deploy command MUST be:
#   npm run deploy
# (builds frontend, then wrangler deploy — plain `npx wrangler deploy` has no SPA)
#
# Secrets: SESSION_SECRET, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY

name = "academic-management-system-254"
main = "workers/src/index.ts"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
preview_urls = true

# React website + SPA fallback (open workers.dev → login UI, not JSON)
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API runs in the Worker; everything else is the React site
run_worker_first = ["/api/*"]

# Drop Flask Container DO registered by earlier deploys
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlaskContainer"]

[[migrations]]
tag = "v2"
deleted_classes = ["FlaskContainer"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
SUPABASE_URL = "https://kbxaawuxlycetxifltxf.supabase.co"
# Same-origin SPA does not need CORS; keep localhost + Pages for alternate hosts
ALLOWED_ORIGINS = "http://localhost:5173,https://ttti-ams.pages.dev"
ENVIRONMENT = "production"
