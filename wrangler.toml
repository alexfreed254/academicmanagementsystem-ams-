# TTTI AMS — single Cloudflare project
#
# SOURCE OF TRUTH
#   Design / UI   → templates/   (Jinja, served by Flask in the Container)
#   Functionality → routes/      (Flask blueprints in the Container)
#
# React (frontend/) is an optional SPA experiment at /spa — not the live portals.

name = "academic-management-system-254"
main = "src/index.ts"
compatibility_date = "2026-07-12"
compatibility_flags = ["nodejs_compat"]

# React build kept available for /spa/* only. Worker runs first for all paths.
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Flask container = full app (routes/ + templates/ + static/)
[[containers]]
class_name = "FlaskContainer"
image = "./Dockerfile"
max_instances = 3
instance_type = "basic"

[[durable_objects.bindings]]
name = "FLASK_CONTAINER"
class_name = "FlaskContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlaskContainer"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
FLASK_ENV = "production"
SPA_ORIGINS = "https://academic-management-system-254.<your-subdomain>.workers.dev"
SPA_CROSS_SITE = "false"

# Optional custom domain after DNS is on Cloudflare:
# routes = [{ pattern = "ams.yourdomain.ac.ke", custom_domain = true }]
