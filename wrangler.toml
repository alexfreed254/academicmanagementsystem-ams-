# TTTI AMS — Cloudflare Worker (edge proxy to Flask)
#
# SOURCE OF TRUTH
#   Design / UI   → templates/   (Jinja on Flask/Render)
#   Functionality → routes/      (Flask blueprints on Flask/Render)
#
# Containers are DISABLED here because Cloudflare CI fails with
# `Unauthorized` when pushing images unless Workers Paid + Containers are active.
# Dockerfile remains in the repo for a later Containers cutover.
#
# Required dashboard variable (plain text):
#   FLASK_ORIGIN = https://<your-render-service>.onrender.com
#
# Flask secrets stay on Render (SECRET_KEY, SUPABASE_*). Do not put them here.

name = "academic-management-system-254"
main = "src/index.ts"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
preview_urls = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
FLASK_ENV = "production"
SPA_CROSS_SITE = "false"
# Set in Dashboard if empty — must be your live gunicorn URL (no trailing slash):
# FLASK_ORIGIN = "https://thika-technical-training-institute-ams.onrender.com"
FLASK_ORIGIN = ""

