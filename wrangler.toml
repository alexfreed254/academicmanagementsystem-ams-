# Cloudflare Workers configuration for TTTI AMS Backend

name = "ttti-ams-backend"
main = "backend/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "ttti-ams-backend"
vars = { ENVIRONMENT = "production" }
compatibility_flags = ["nodejs_compat"]

[env.staging]
name = "ttti-ams-backend-staging"
vars = { ENVIRONMENT = "staging" }
compatibility_flags = ["nodejs_compat"]

# KV Namespaces for session storage (create with: wrangler kv:namespace create SESSIONS)
# Uncomment and add your KV namespace ID after creation
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "your-kv-namespace-id-here"

# Durable Objects for real-time features (biometric, notifications)
# Uncomment after backend implementation is complete
# [[durable_objects.bindings]]
# name = "BIOMETRIC_SESSION"
# class_name = "BiometricSession"
# script_name = "ttti-ams-backend"

# [[migrations]]
# tag = "v1"
# new_classes = ["BiometricSession"]

# Environment variables (set via dashboard or CLI)
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# JWT_SECRET
# CSRF_SECRET

# Rate limiting
[limits]
cpu_ms = 50
