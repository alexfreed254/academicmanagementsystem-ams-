# Cloudflare Workers configuration for TTTI AMS Backend
# Wrangler v4 compatible

name = "ttti-ams-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Production environment
[env.production]
name = "ttti-ams-backend"
vars = { ENVIRONMENT = "production" }

# Staging environment
[env.staging]
name = "ttti-ams-backend-staging"
vars = { ENVIRONMENT = "staging" }

# Development uses default values

# Environment secrets (set via: wrangler secret put VARIABLE_NAME)
# Required secrets:
# - SUPABASE_URL
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY
# - JWT_SECRET
# - CSRF_SECRET

# KV Namespaces for session storage
# Create with: wrangler kv:namespace create SESSIONS
# Then uncomment and add the ID below:
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "your-kv-namespace-id-here"
# preview_id = "your-preview-kv-namespace-id-here"

# Durable Objects for real-time features
# Uncomment when implementing biometric sessions:
# [[durable_objects.bindings]]
# name = "BIOMETRIC_SESSION"
# class_name = "BiometricSession"
# script_name = "ttti-ams-backend"

# [[migrations]]
# tag = "v1"
# new_classes = ["BiometricSession"]

# Observability
[observability]
enabled = true

# Limits
[limits]
cpu_ms = 50
