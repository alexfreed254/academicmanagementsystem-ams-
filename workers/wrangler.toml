# TTTI AMS API — Cloudflare Worker (Hono + TypeScript)
# Prefer root `wrangler.toml` + `npm run deploy` so the React SPA is also served.
# This file is for API-only local work (`cd workers && npm run dev`) WITH assets.
name = "my-ams-project"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Serve built React app so http://127.0.0.1:8787 shows the login UI (not JSON)
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Non-secret configuration. Secrets go in `.dev.vars` / `wrangler secret put`.
[vars]
SUPABASE_URL = "https://kbxaawuxlycetxifltxf.supabase.co"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:8787,http://localhost:8787"
ENVIRONMENT = "production"

[observability]
enabled = true
