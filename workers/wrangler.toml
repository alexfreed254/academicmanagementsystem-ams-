# ⚠️ DEPRECATED — do not deploy this file for production.
#
# Production is the monorepo ROOT wrangler.jsonc:
#   one Worker = React SPA (frontend/dist) + Hono API (workers/src)
#
# This split-API Worker name (ttti-ams-api) belongs to the obsolete
# Pages + separate API topology. Keep the file only for local reference.
#
# Local API-only: prefer `npx wrangler dev` from the repo root instead.

name = "ttti-ams-api-unused"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
ALLOWED_ORIGINS = "http://localhost:5173"
ENVIRONMENT = "development"

[observability]
enabled = true
